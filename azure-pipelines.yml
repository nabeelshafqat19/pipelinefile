trigger:
- main

pool:
  name: Personal2  # Agent name specified as Personal2

variables:
  DOCKER_IMAGE: 'kokoopoli/flutterizio:1' # Docker Hub image with tag 1
  ACR_NAME: 'pipelinecontainer'           # Azure Container Registry name
  RESOURCE_GROUP: 'RG-Nabeel'             # Resource Group name
  AZURE_SUBSCRIPTION: '5ddc5244-dc45-41ac-be03-0f23200244fb' # Subscription ID
  WEB_APP_NAME: 'dockerpipelinewebapp'    # Web App name
  ACR_IMAGE_NAME: 'pipelinecontainer'     # Container name in ACR

steps:
# Step 1: Pull image from Docker Hub
- task: Docker@2
  displayName: 'Pull Docker Image from Docker Hub'
  inputs:
    command: 'pull'
    arguments: '$(DOCKER_IMAGE)'

# Step 2: Tag and Push Image to ACR
- task: Docker@2
  displayName: 'Tag Docker Image for ACR'
  inputs:
    command: 'tag'
    arguments: '$(DOCKER_IMAGE) $(ACR_NAME).azurecr.io/$(ACR_IMAGE_NAME):1'

- task: Docker@2
  displayName: 'Push Docker Image to ACR'
  inputs:
    command: 'push'
    arguments: '$(ACR_NAME).azurecr.io/$(ACR_IMAGE_NAME):1'

# Step 3: Configure Web App with ACR
- task: AzureCLI@2
  displayName: 'Set Up Web App with ACR'
  inputs:
    azureSubscription: '$(AZURE_SUBSCRIPTION)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az webapp config container set \
        --name $(WEB_APP_NAME) \
        --resource-group $(RESOURCE_GROUP) \
        --docker-custom-image-name $(ACR_NAME).azurecr.io/$(ACR_IMAGE_NAME):1 \
        --docker-registry-server-url https://$(ACR_NAME).azurecr.io
